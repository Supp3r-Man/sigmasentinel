id: SS-009
title: Password spraying - one source failing against many accounts
status: experimental
description: Eight or more distinct accounts fail to log in from one source IP within ten minutes.
logsource:
  category: authentication
detection:
  selection:
    event_type: login_failure
  timeframe: 10m
  condition: selection | count(distinct user) by src_ip >= 8
level: high
attack_technique: T1110.003
falsepositives:
  - Shared office NAT address on a Monday morning
  - Misconfigured SSO connector retrying for the whole directory
